$kind: http-request
name: Login
url: '{{baseUrl}}/auth/login'
method: POST
body:
  type: json
  content: |-
    {
        "email": "user@example.com",
        "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (json.token) {
        pm.environment.set("TOKEN", json.token);
      }
